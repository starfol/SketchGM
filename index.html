<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная Карта Мира — Phantasm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #0a050f; font-family: system-ui; }
    #map-container {
      width: 100vw;
      height: 100vh;
      background: url('https://i.pinimg.com/originals/79/e7/fe/79e7fe469a91b023af2517fe4a53f28a.jpg') center/cover no-repeat;
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .location {
      position: absolute;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%);
      transition: all 0.25s ease;
      z-index: 10;
    }
    .location:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 20; }
    .house {
      width: 100%;
      height: 100%;
      background: rgba(236, 72, 153, 0.95);
      border: 4px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.7);
    }
    .character {
      position: absolute;
      top: -75px;
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      border: 3px solid white;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .tooltip {
      position: absolute;
      top: -95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 15px;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
    }
    .location:hover .tooltip { opacity: 1; top: -105px; }

    /* Карточка */
    #locationModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="map-container">
    <!-- Пример локаций -->
    <div class="location" style="left: 28%; top: 42%;">
      <div class="character" style="background-image: url('https://i.imgur.com/example1.jpg')"></div>
      <div class="house">🏰</div>
      <div class="tooltip">Замок Вороньего Гнезда</div>
    </div>

    <div class="location" style="left: 52%; top: 38%;">
      <div class="character" style="background-image: url('https://i.imgur.com/example2.jpg')"></div>
      <div class="house">🌲</div>
      <div class="tooltip">Тёмный Лес</div>
    </div>

    <div class="location" style="left: 65%; top: 65%;">
      <div class="character" style="background-image: url('https://i.imgur.com/example3.jpg')"></div>
      <div class="house">🏠</div>
      <div class="tooltip">Деревня Элдервуд</div>
    </div>

    <!-- Добавляй сюда свои локации -->
  </div>

  <!-- Карточка локации -->
  <div id="locationModal" onclick="if(event.target===this) hideModal()">
    <div class="glass max-w-lg w-full mx-4 rounded-3xl p-8 text-white">
      <button onclick="hideModal()" class="float-right text-3xl leading-none">×</button>
      <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
      <div id="modalContent" class="text-zinc-300 leading-relaxed"></div>
    </div>
  </div>

  <script>
    const map = document.getElementById('map-container');
    let scale = 1;
    let isDragging = false;
    let startX, startY, scrollLeft, scrollTop;

    // Перетаскивание
    map.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.pageX - map.offsetLeft;
      startY = e.pageY - map.offsetTop;
      scrollLeft = map.scrollLeft;
      scrollTop = map.scrollTop;
    });

    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const x = e.pageX - map.offsetLeft;
      const y = e.pageY - map.offsetTop;
      map.scrollLeft = scrollLeft - (x - startX);
      map.scrollTop = scrollTop - (y - startY);
    });

    // Зум колёсиком
    map.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale = Math.min(Math.max(0.5, scale * delta), 4);
      map.style.transform = `scale(${scale})`;
    });

    // Открытие карточки
    function showLocation(title, content) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('locationModal').style.display = 'flex';
    }

    function hideModal() {
      document.getElementById('locationModal').style.display = 'none';
    }

    // Пример: клик по локациям
    document.querySelectorAll('.location').forEach(loc => {
      loc.addEventListener('click', () => {
        const title = loc.querySelector('.tooltip').textContent;
        const content = `
          <p class="mb-4">Здесь живёт важный персонаж или происходит ключевые события.</p>
          <p><strong>Описание:</strong> Красивое место с богатой историей...</p>
        `;
        showLocation(title, content);
      });
    });
  </script>
</body>
</html>
