<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Карты — Phantasm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body { margin:0; background:#0a050f; font-family:system-ui; overflow:hidden; }
    #map {
      width: 100vw;
      height: 100vh;
      background: #111827;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    .character {
      position: absolute;
      width: 85px;
      height: 85px;
      border: 4px solid #ec4899;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.7);
      cursor: move;
      user-select: none;
    }
    .line {
      position: absolute;
      height: 5px;
      background: linear-gradient(to right, #ec4899, #a855f7);
      transform-origin: left center;
      pointer-events: all;
      cursor: pointer;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="absolute top-4 left-4 z-50 bg-black/80 p-5 rounded-3xl text-white flex flex-wrap gap-3 items-center">
    <input id="imgUrl" type="text" placeholder="Ссылка на изображение" class="bg-zinc-900 px-4 py-3 rounded-2xl w-96">
    <button onclick="addCharacter()" class="bg-pink-600 px-6 py-3 rounded-2xl hover:bg-pink-700">Добавить персонажа</button>
    <button onclick="addPlaceholder()" class="bg-zinc-700 px-6 py-3 rounded-2xl hover:bg-zinc-600">Добавить без картинки</button>
    <button onclick="takeScreenshot()" class="bg-emerald-600 px-6 py-3 rounded-2xl hover:bg-emerald-700">📸 Скриншот карты</button>
    <button onclick="clearAll()" class="bg-red-600 px-6 py-3 rounded-2xl hover:bg-red-700">Очистить всё</button>
  </div>

  <div id="map"></div>

  <script>
    let characters = [];
    let connections = [];
    const map = document.getElementById('map');

    // Загрузка
    function loadData() {
      const saved = localStorage.getItem('phantasmMap');
      if (!saved) return;
      const data = JSON.parse(saved);

      data.characters.forEach(c => {
        const el = createCharacterElement(c.img, c.left, c.top, c.id);
        map.appendChild(el);
        characters.push(el);
      });

      data.connections.forEach(conn => {
        const a = characters.find(ch => ch.dataset.id === conn.from);
        const b = characters.find(ch => ch.dataset.id === conn.to);
        if (a && b) drawLine(a, b, true);
      });
    }

    function createCharacterElement(imgUrl, left, top, id = Date.now().toString()) {
      const char = document.createElement('div');
      char.className = 'character';
      char.style.backgroundImage = imgUrl ? `url('${imgUrl}')` : 'none';
      char.style.left = left || '40%';
      char.style.top = top || '40%';
      char.dataset.id = id;
      makeDraggable(char);
      return char;
    }

    function addCharacter() {
      const url = document.getElementById('imgUrl').value.trim();
      if (!url) return alert("Вставьте ссылку на изображение");
      const char = createCharacterElement(url);
      map.appendChild(char);
      characters.push(char);
      saveData();
    }

    function addPlaceholder() {
      const char = createCharacterElement(null);
      map.appendChild(char);
      characters.push(char);
      saveData();
    }

    function makeDraggable(el) {
      el.addEventListener('mousedown', e => {
        if (e.button === 0) startDrag(e, el);
      });
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        startConnection(el);
      });
    }

    let dragging = null;
    function startDrag(e, el) {
      dragging = el;
    }

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      dragging.style.left = (e.clientX / window.innerWidth * 100) + '%';
      dragging.style.top = (e.clientY / window.innerHeight * 100) + '%';
    });

    document.addEventListener('mouseup', () => {
      if (dragging) {
        saveData();
        dragging = null;
      }
    });

    // Связи
    let startChar = null;
    function startConnection(char) {
      if (!startChar) {
        startChar = char;
      } else if (startChar !== char) {
        drawLine(startChar, char);
        startChar = null;
      }
    }

    function drawLine(a, b, isLoad = false) {
      const line = document.createElement('div');
      line.className = 'line';
      line.dataset.from = a.dataset.id;
      line.dataset.to = b.dataset.id;

      updateLine(line, a, b);
      map.appendChild(line);
      connections.push(line);

      // Удаление связи
      line.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (confirm("Удалить связь?")) {
          line.remove();
          connections = connections.filter(l => l !== line);
          saveData();
        }
      });

      if (!isLoad) saveData();
    }

    function updateLine(line, a, b) {
      const rectA = a.getBoundingClientRect();
      const rectB = b.getBoundingClientRect();
      const mapRect = map.getBoundingClientRect();

      const x1 = rectA.left + rectA.width/2 - mapRect.left;
      const y1 = rectA.top + rectA.height/2 - mapRect.top;
      const x2 = rectB.left + rectB.width/2 - mapRect.left;
      const y2 = rectB.top + rectB.height/2 - mapRect.top;

      const length = Math.hypot(x2-x1, y2-y1);
      const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

      line.style.width = length + 'px';
      line.style.left = x1 + 'px';
      line.style.top = y1 + 'px';
      line.style.transform = `rotate(${angle}deg)`;
    }

    // Скриншот
    function takeScreenshot() {
      html2canvas(map, { scale: 2, useCORS: true }).then(canvas => {
        canvas.toBlob(blob => {
          navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
            .then(() => alert('✅ Скриншот всей карты скопирован в буфер!'))
            .catch(() => alert('Не удалось скопировать'));
        });
      });
    }

    function saveData() {
      const charData = characters.map(ch => ({
        id: ch.dataset.id,
        img: ch.style.backgroundImage ? ch.style.backgroundImage.slice(5, -2) : null,
        left: ch.style.left,
        top: ch.style.top
      }));

      const connData = connections.map(line => ({
        from: line.dataset.from,
        to: line.dataset.to
      }));

      localStorage.setItem('phantasmMap', JSON.stringify({
        characters: charData,
        connections: connData
      }));
    }

    function clearAll() {
      if (confirm("Удалить ВСЁ?")) {
        localStorage.removeItem('phantasmMap');
        location.reload();
      }
    }

    // Запуск
    window.onload = () => {
      loadData();
    };
  </script>
</body>
</html>
